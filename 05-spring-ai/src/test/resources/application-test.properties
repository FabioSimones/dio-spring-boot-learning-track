# Test profile (TASK-012): H2 in memory only - never MySQL, never a real
# datasource, never a real OpenAI call. "sa" with a blank password is H2's
# own well-known default test account, not a project secret.
spring.datasource.url=jdbc:h2:mem:budgeting_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deliberately NOT a valid OpenAI key shape (no "sk-" prefix, human-readable
# and self-describing) - constructing ChatClient/TranscriptionModel/
# TextToSpeechModel beans never makes a network call, so this only has to
# satisfy property resolution, never a real credential.
spring.ai.openai.api-key=test-key-not-a-real-credential
logging.level.org.springframework.ai=WARN

# TASK-010: the cleanup scheduler must never run on a real clock during tests -
# IdempotencyCleanupSchedulerTest / IdempotencyCleanupServiceTest call the
# service methods directly instead.
app.idempotency.cleanup-enabled=false

# Actuator/Swagger keep the common baseline (health,metrics; springdoc
# enabled by default) - ActuatorEndpointsTest/SwaggerDocumentationTest rely on
# both being reachable in this profile.
