# Local development profile (TASK-012) - activate with SPRING_PROFILES_ACTIVE=dev.
# Every value below is either a safe localhost default or a bare ${VAR}
# placeholder - this file contains NO real credential and is safe to version.
#
# Two ways to point this app at MySQL locally:
#   1) `docker compose up` (see compose.yml) with NO active profile at all -
#      spring-boot-docker-compose (a developmentOnly dependency, absent from
#      the production artifact) auto-detects the container and wires the
#      datasource for you; none of the spring.datasource.* below is read.
#   2) Activate this "dev" profile against a MySQL instance you already run
#      yourself (a different host, a manually started container, etc.) by
#      setting DB_URL/DB_USERNAME/DB_PASSWORD.
# Don't mix both: an active "dev" profile's explicit spring.datasource.*
# properties take precedence over any auto-detected compose connection.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/budgeting}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# update is convenient for iterating locally, but it is not a substitute for
# versioned migrations (this project does not use Flyway/Liquibase yet) - it
# can silently apply destructive schema changes. Never use it in prod.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mandatory, no default: EnvironmentConfigurationValidator fails startup with
# a clear message ("A variável OPENAI_API_KEY é obrigatória...") instead of
# letting the app come up with a blank key that only fails on the first real
# voice command.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Extra verbosity only in dev, only for the two packages that matter - never
# org.springframework.web/org.hibernate.SQL globally (see application.properties).
logging.level.org.springframework.ai=DEBUG
logging.level.dio.budgeting=DEBUG

# Same exposure as the common baseline (health+metrics) - dev has nothing to
# hide from itself; see application-prod.properties.example for the
# restricted production posture.
management.endpoints.web.exposure.include=health,metrics
