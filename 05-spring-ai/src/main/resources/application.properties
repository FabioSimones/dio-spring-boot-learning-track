# Base properties shared by every environment (TASK-012). Deliberately
# contains NO secret, NO datasource, and NO active profile: select dev/test/
# prod externally (SPRING_PROFILES_ACTIVE) - see README "Configuração por
# ambiente". Running with no profile at all only loads this file; it is not a
# fully standalone runtime configuration (no OpenAI key, no datasource) - that
# is by design, not an oversight.
spring.application.name=budgeting

# --- Upload: single source of truth, multipart limits derive from it ---
app.audio.max-size=${AUDIO_MAX_SIZE:10MB}
spring.servlet.multipart.max-file-size=${app.audio.max-size}
spring.servlet.multipart.max-request-size=${app.audio.max-size}

# --- Spring AI: model/timeout/retry only - NEVER the credential (see
# application-dev.properties / application-prod.properties.example) ---
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.\
  Áudio contém descrição de gastos financeiros. \
  As frases geralmente contêm: \
   - um valor em reais (número + "reais"); \
   - uma ação (gastei, paguei, comprei); \
   - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3

# Resilience: shared by chat, transcription and speech clients (single RetryTemplate/
# RestClient.Builder bean, see SpringAiRetryAutoConfiguration/RestClientAutoConfiguration -
# there is no native per-model override, only these two global knobs).
# Retries only 5xx/connection failures (TransientAiException/ResourceAccessException);
# 4xx (incl. 401 and 429) is never retried automatically, see SpringAiRetryProperties.
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=2s
spring.http.clients.connect-timeout=${AI_CONNECT_TIMEOUT:10s}
spring.http.clients.read-timeout=${AI_READ_TIMEOUT:60s}

# --- Idempotency retention/cleanup (TASK-010), all under app.idempotency.* ---
# completed/failed-retention and processing-timeout accept Boot's simple
# Duration units (h, m, s...); cleanup-interval must stay ISO-8601 (PT..) - see
# IdempotencyProperties javadoc for why.
app.idempotency.completed-retention=${IDEMPOTENCY_COMPLETED_RETENTION:24h}
app.idempotency.failed-retention=${IDEMPOTENCY_FAILED_RETENTION:24h}
app.idempotency.processing-timeout=${IDEMPOTENCY_PROCESSING_TIMEOUT:15m}
app.idempotency.cleanup-interval=PT1H
app.idempotency.cleanup-enabled=${IDEMPOTENCY_CLEANUP_ENABLED:true}
app.idempotency.batch-size=100

# --- Observability (TASK-011): health+metrics baseline - prod narrows this
# further (application-prod.properties.example) to health only. Never env,
# beans, configprops, heapdump, threaddump, mappings, logfile, or "*". ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# --- Logging: INFO by default everywhere, correlation ID always present.
# Never org.springframework.web/org.hibernate.SQL at DEBUG here - that's an
# explicit, deliberate opt-in in application-dev.properties only. ---
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
